[project]
name = "mlt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marcel", email = "marcel.besson@web.de" }
]
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.136.1",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "missingno>=0.5.2",
    "mlflow>=3.12.0",
    "numpy>=2.3,<2.4",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shap>=0.50.0",
    "streamlit>=1.58.0",
]

[project.scripts]
mlt = "mlt:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.0",
    "ruff>=0.15.12",
]
